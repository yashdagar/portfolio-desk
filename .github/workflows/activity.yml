name: Refresh activity feed

# The collector needs tokens that can read private repos. Running it here rather
# than at request time means those tokens live in Actions secrets and are never
# present in the deployed app, which is public. Only redacted output is
# committed.

on:
  schedule:
    # Every 20 minutes. GitHub's scheduler is best-effort and drifts under load,
    # so treat this as "roughly every half hour".
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect-activity.ts"
      - "src/lib/activity.ts"
      - ".github/workflows/activity.yml"

concurrency:
  group: activity
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The redaction rules are the reason this job is safe to run at all, so a
      # regression in them must stop the run before anything is written.
      - name: Verify redaction rules
        run: npx tsx --test src/lib/activity.test.ts

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          WORK_GITHUB_TOKEN: ${{ secrets.WORK_GITHUB_TOKEN }}
        run: npx tsx scripts/collect-activity.ts

      # Belt and braces over the in-process guard: grep the file that is about
      # to be committed for anything that should never have reached it.
      - name: Audit output
        run: npx tsx scripts/audit-activity.ts

      - name: Commit if changed
        run: |
          if git diff --quiet public/data/activity.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "activity-bot"
          git config user.email "activity-bot@users.noreply.github.com"
          git add public/data/activity.json
          # [skip ci] so Vercel doesn't redeploy for a data refresh. The site
          # reads this file from raw.githubusercontent.com at request time
          # (ACTIVITY_URL in src/lib/activity.ts), so a deploy adds nothing,
          # and every twenty minutes it would be ~70 builds a day against
          # Vercel's daily deployment limit.
          #
          # Self-triggering isn't a risk either way: the push trigger above
          # only watches the collector and its lib, never public/data.
          git commit -m "chore(data): refresh activity feed [skip ci]"
          git push
